name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "-X main.version=${{ github.ref_name }}" -o "swat-dashboard${EXT}" .

      - name: Package (tar.gz for unix)
        if: matrix.goos != 'windows'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PLATFORM="${{ matrix.goos }}-${{ matrix.goarch }}"
          tar -czf "swat-dashboard-${TAG}-${PLATFORM}.tar.gz" swat-dashboard

      - name: Package (zip for windows)
        if: matrix.goos == 'windows'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PLATFORM="${{ matrix.goos }}-${{ matrix.goarch }}"
          zip "swat-dashboard-${TAG}-${PLATFORM}.zip" swat-dashboard.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swat-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: swat-dashboard-*.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            swat-dashboard-*.tar.gz
            swat-dashboard-*.zip
