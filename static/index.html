<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWAT Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>⚡ SWAT Dashboard</h1>
  <div class="stats">
    <span class="stat active" id="stat-active">Active: 0</span>
    <span class="stat" id="stat-completed">Completed: 0</span>
    <span class="stat failed" id="stat-failed">Failed: 0</span>
  </div>
</div>

<div class="main">
  <div class="left">
    <div class="section-title">Active</div>
    <div class="active-list" id="active-list"></div>

    <div class="section-title">History</div>
    <div class="filters">
      <select id="filter-squad"><option value="">All Squads</option></select>
      <select id="filter-status">
        <option value="">All Status</option>
        <option value="completed">Completed</option>
        <option value="failed">Failed</option>
      </select>
      <input type="text" id="filter-keyword" placeholder="Search...">
    </div>
    <div class="history-list" id="history-list"></div>
    <div class="load-more" id="load-more" style="display:none">
      <button onclick="loadMore()">Load More</button>
    </div>
  </div>

  <div class="right">
    <div class="right-header">
      <div class="tab active" id="tab-session" onclick="showTab('session')">Session</div>
      <div class="tab" id="tab-detail" onclick="showTab('detail')">Detail</div>
      <select id="runtime-select" style="margin-left:auto;background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:4px 8px;font-size:12px;">
        <option value="copilot">Copilot CLI</option>
        <option value="gemini">Gemini CLI</option>
      </select>
    </div>
    <div class="right-content">
      <div id="terminal-container" class="visible">
        <div id="terminal-placeholder" style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;">
          <div style="color:var(--fg2);font-size:14px;">Connecting...</div>
        </div>
        <div id="terminal-inner" style="width:100%;height:100%;display:none;"></div>
      </div>
      <div id="detail-view">
        <div class="empty" id="detail-empty">Select an operation to view details</div>
        <div id="detail-content" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="app.js"></script>
</body>
</html>
